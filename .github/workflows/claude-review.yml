# Standalone (not a caller): this repo is PUBLIC and cannot use the org's
# internal reusable workflow (ApicaSystem/shared-workflows @v1). Keep this file
# in sync with that @v1 by hand when it changes.
#
# Requires, on THIS repo (public repos see no org secrets/vars):
#   - secret ANTHROPIC_AUTH_TOKEN   (falls back to LITELLM_API_KEY)
#   - variable ANTHROPIC_BASE_URL   (falls back to LITELLM_BASE_URL)
#   - anthropics/claude-code-action allowed in this org's Actions policy
#   - the Claude GitHub App installed on this repo (so claude[bot] can post)
# The --model below must match whichever provider those secrets point at:
# vertex_ai/claude-sonnet-4-6 for the LiteLLM gateway, or claude-sonnet-4-6
# with ANTHROPIC_BASE_URL=https://api.anthropic.com for the direct Anthropic API.
#
# Public-repo hardening: the mention and dismiss jobs are gated to
# OWNER/MEMBER/COLLABORATOR, because their raw `gh api` steps bypass
# claude-code-action's own permission check — without the gate any outside
# commenter could run the model (cost) or clear Claude's changes-requested.

name: Claude PR Review

on:
  pull_request:
    types: [opened]
    paths-ignore:
      - '**/*.lock'
      - 'config.guess'
      - 'config.sub'
      - 'install-sh'
      - 'buildtools/mkinstalldirs'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    # Skip drafts, and skip fork PRs: secrets are not available to
    # fork-originated runs (so most external OSS contributions are not
    # auto-reviewed; a maintainer can @claude review after checkout).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      checks: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@fad22eb3fa582b7357fc0ea48af6645851b884fd # v1
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || vars.LITELLM_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN || secrets.LITELLM_API_KEY }}
          track_progress: true
          classify_inline_comments: true
          prompt: |
            Review this pull request.

            You have a hard budget of 30 agent turns; the run is killed when it
            is exhausted. Work incrementally so partial results survive: post
            each inline comment as soon as you confirm the issue — never save
            findings for the end. Read the diff first, then only the
            highest-risk files it touches. If the budget is nearly spent,
            stop exploring and submit your verdict on what you have seen.

            First read .github/resources/CLAUDE.md and follow its documented
            conventions, focus areas, and known-intentional settings to avoid
            false positives. If that file is absent, proceed with the general
            guidance below.

            Focus on:
            - Correctness bugs and logic errors
            - Security concerns (secrets or PII in logs, injection, unvalidated
              input, missing/bypassed auth, overly broad permissions)
            - New dependencies added without obvious justification
            - Resource safety (leaks, unclosed handles, unbounded allocations)
            - Readability and maintainability

            Report every high-severity issue. Add medium/low only if they
            materially matter; skip style the linter handles. Use inline
            comments for line-specific feedback, formatted exactly:
            **[HIGH|MEDIUM|LOW]** Problem in one sentence. Fix: one sentence.
            You may add a ```suggestion block with the corrected code when a
            finding materially affects correctness or code quality and the
            fix is a few concrete lines within the diff — the author can
            apply it in one click. Use these sparingly; they cost tokens.
            For minor findings and larger fixes, prose is enough.
            End with a brief summary comment for the author — a few sentences
            on what matters most, not a retelling of the diff. No praise.

            Verdict: if you find one or more blocking issues (correctness bugs,
            security problems, or changes that would break production), submit
            a changes-requested review:
              gh pr review --request-changes --body "<concise list of the blockers>"
            Reserve this for clear blockers only. If the findings are minor or
            stylistic, leave comments without requesting changes. Do not
            approve the pull request.
          claude_args: >-
            --model vertex_ai/claude-sonnet-4-6
            --max-turns 30
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*)"

      - name: Notify on incomplete review
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "The automatic Claude review did not complete (turn budget exhausted or a transient error — see the run log). Inline comments already posted above still stand. Mention @claude to continue or re-run the review."

  claude-mention:
    # OWNER/MEMBER/COLLABORATOR only (see header). Ignore bot events; react to
    # "@claude" but not "@claude dismiss" (handled by claude-dismiss).
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude dismiss') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude dismiss') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && !contains(github.event.review.body, '@claude dismiss') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      checks: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@fad22eb3fa582b7357fc0ea48af6645851b884fd # v1
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || vars.LITELLM_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN || secrets.LITELLM_API_KEY }}
          claude_args: >-
            --model vertex_ai/claude-sonnet-4-6
            --max-turns 30
            --append-system-prompt "When reviewing or answering questions about code in this pull request, first read .github/resources/CLAUDE.md if it exists and follow its documented conventions, focus areas, and known-intentional settings to avoid false positives. If you are re-reviewing after the author addressed earlier feedback, re-check the previously-blocking issues and any newly changed code: if one or more blockers still stand, restate only those and submit gh pr review --request-changes; if nothing blocking remains, do not submit a changes-requested review (never approve) and the stale verdict is cleared automatically."
            --allowedTools "Read,Grep,Glob,LS,mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*)"

      - name: Clear stale verdict when a re-review finds no blockers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          SINCE: ${{ github.event.comment.created_at || github.event.review.submitted_at }}
          BODY: ${{ github.event.comment.body }}
          RBODY: ${{ github.event.review.body }}
        run: |
          if ! printf '%s' "${BODY:-$RBODY}" | grep -qi 'review'; then
            echo "Not a re-review request; leaving review state unchanged."
            exit 0
          fi
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews")
          reblocked=$(printf '%s' "$reviews" | jq --arg t "$SINCE" \
            '[.[] | select(.user.login=="claude[bot]" and .state=="CHANGES_REQUESTED" and .submitted_at > $t)] | length')
          if [ "${reblocked:-0}" -gt 0 ]; then
            echo "Claude re-posted a changes-requested this run; leaving the block."
            exit 0
          fi
          ids=$(printf '%s' "$reviews" | jq -r --arg t "$SINCE" \
            '.[] | select(.user.login=="claude[bot]" and .state=="CHANGES_REQUESTED" and .submitted_at <= $t) | .id')
          if [ -z "$ids" ]; then echo "No stale claude[bot] changes-requested to clear."; exit 0; fi
          for id in $ids; do
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
              -f message="Superseded by @claude re-review; no blockers remain." -f event=DISMISS \
              && echo "Dismissed stale review $id"
          done

  claude-dismiss:
    # Explicit human override: "@claude dismiss" clears the automated
    # changes-requested verdict. OWNER/MEMBER/COLLABORATOR only (raw gh api,
    # no permission check of its own). Only dismisses claude[bot]'s own review.
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude dismiss') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude dismiss') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude dismiss') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Dismiss Claude's changes-requested review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          ids=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login=="claude[bot]" and .state=="CHANGES_REQUESTED") | .id')
          if [ -z "$ids" ]; then
            echo "No outstanding claude[bot] changes-requested review to dismiss."
            exit 0
          fi
          for id in $ids; do
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
              -f message="Dismissed via @claude dismiss by @$ACTOR." -f event=DISMISS \
              && echo "Dismissed review $id"
          done
          gh pr comment "$PR" --repo "$REPO" \
            --body "Dismissed the automated \"changes requested\" review at @$ACTOR's request. Trigger a fresh review anytime with a new Claude mention."
